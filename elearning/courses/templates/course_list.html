<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Courses</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}

/* 🔷 Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 40px;
    background: rgba(2,6,23,0.9);
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #38bdf8;
}

.nav-links a {
    color: #cbd5f5;
    margin-left: 20px;
    text-decoration: none;
}

.nav-links a:hover {
    color: #38bdf8;
}

/* 🔷 Welcome */
.header {
    padding: 30px 40px;
}

.header h2 {
    margin: 0;
}

.header p {
    color: #94a3b8;
}

/* 🔷 Cards */
.cards {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    padding: 20px 40px;
}

/* 🔷 Card */
.card {
    width: 260px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.card-content {
    padding: 15px;
}

.card h3 {
    margin: 10px 0;
}

.card p {
    color: #94a3b8;
    font-size: 14px;
}

.card a {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 15px;
    background: #38bdf8;
    color: black;
    border-radius: 6px;
    text-decoration: none;
}
</style>
</head>

<body>

<!-- 🔷 Navbar -->
<div class="navbar">
    <div class="logo">🎓 LearnX</div>

    <div class="nav-links">
        <a href="{% url 'course_list' %}">Home</a>
        <a href="#">My Learning</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>
</div>

<!-- 🔷 Welcome -->
<div class="header">
    <h2>Welcome, {{ request.user.username }} 👋</h2>
    <p>Explore courses and start learning today</p>
</div>
<div class="cards">

{% for course in courses %}
    <div class="card">

        {% if course.image %}
            <img src="{{ course.image }}" alt="{{ course.title }}">
        {% endif %}

        <div class="card-content">
            <h3>{{ course.title }}</h3>
            <p>{{ course.description }}</p>

            <a href="{% url 'course_detail' course.id %}">Start</a>
        </div>
    </div>
{% endfor %}

</div>

</body>
</html>
